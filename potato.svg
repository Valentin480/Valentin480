<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .potato { animation: bounce 1.5s ease-in-out infinite; transform-origin: 120px 225px; }
    .shadow { animation: shadow 1.5s ease-in-out infinite; transform-origin: 120px 244px; }
    .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    .cheek { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1.06, 0.94); }
      50%      { transform: translateY(-34px) scale(0.97, 1.04); }
    }
    @keyframes shadow {
      0%, 100% { transform: scale(1);   opacity: 0.35; }
      50%      { transform: scale(0.65); opacity: 0.15; }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.9; }
    }
  </style>

  <ellipse class="shadow" cx="120" cy="244" rx="62" ry="10" fill="#000"/>

  <g class="potato">
    <path d="M120 40 C172 34 208 76 203 128 C199 180 170 224 118 226 C64 228 36 184 41 128 C45 80 75 44 120 40 Z"
          fill="#d9a85f" stroke="#a97a3a" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="82"  cy="82"  rx="7" ry="4.5" fill="#b98a47" transform="rotate(-25 82 82)"/>
    <ellipse cx="160" cy="70"  rx="6" ry="4"   fill="#b98a47" transform="rotate(20 160 70)"/>
    <ellipse cx="176" cy="150" rx="7" ry="4.5" fill="#b98a47" transform="rotate(35 176 150)"/>
    <ellipse cx="68"  cy="168" rx="6" ry="4"   fill="#b98a47" transform="rotate(-15 68 168)"/>
    <ellipse cx="128" cy="200" rx="7" ry="4"   fill="#b98a47" transform="rotate(10 128 200)"/>

    <ellipse class="cheek" cx="78"  cy="150" rx="13" ry="8" fill="#e58a7a"/>
    <ellipse class="cheek" cx="162" cy="150" rx="13" ry="8" fill="#e58a7a"/>

    <g class="eye"><circle cx="94"  cy="128" r="9" fill="#2b1d0e"/><circle cx="97"  cy="125" r="3" fill="#fff"/></g>
    <g class="eye"><circle cx="146" cy="128" r="9" fill="#2b1d0e"/><circle cx="149" cy="125" r="3" fill="#fff"/></g>

    <path d="M104 156 Q120 172 136 156" fill="none" stroke="#2b1d0e" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
